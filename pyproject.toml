[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeos"
version = "0.1.0"
description = "Autonomous crypto intelligence and trading operating system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
# solders is only needed to run the signer-service tests; the tradeos
# process itself never imports it (the signer is a separate process).
dev = ["pytest>=8", "pytest-asyncio>=0.23", "solders>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeos = ["db/*.sql", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
