<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeOS</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;
--green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,system-ui,sans-serif;
padding-bottom:70px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);
padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
h1{font-size:17px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border)}
.pill.ok{color:var(--green);border-color:var(--green)}
.pill.bad{color:var(--red);border-color:var(--red)}
main{padding:12px;max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.card .label{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.card .value{font-size:22px;font-weight:600;margin-top:2px}
.pos .value{font-size:18px}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.dim{color:var(--dim)}
section{margin-bottom:16px}
section h2{font-size:14px;color:var(--dim);margin:14px 0 8px;text-transform:uppercase;
letter-spacing:.04em}
.row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
margin-bottom:8px;font-size:14px}
.row .top{display:flex;justify-content:space-between;font-weight:600}
.row .sub{color:var(--dim);font-size:12px;margin-top:2px;word-break:break-all}
button{font:inherit;border:none;border-radius:10px;padding:12px;width:100%;font-weight:700;
cursor:pointer}
#killBtn{background:var(--red);color:#fff}
#resumeBtn{background:var(--green);color:#0d1117;display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--dim);border-radius:0;padding:12px 0;font-size:12px;
font-weight:600}
nav button.active{color:var(--blue)}
#tokenBox{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>TradeOS</h1>
  <span id="modePill" class="pill">…</span>
</header>
<main>
  <div id="authView">
    <section><h2>Access token</h2>
      <input id="tokenBox" type="password" placeholder="Dashboard token" autocomplete="current-password">
      <button id="loginBtn" style="background:var(--blue);color:#fff">Connect</button>
    </section>
  </div>

  <div id="appView" class="hidden">
    <div id="tab-dash">
      <div class="grid">
        <div class="card"><div class="label">Equity</div><div class="value" id="equity">–</div></div>
        <div class="card"><div class="label">Cash</div><div class="value" id="cash">–</div></div>
        <div class="card"><div class="label">Daily P&L</div><div class="value" id="dailyPnl">–</div></div>
        <div class="card"><div class="label">Unrealized</div><div class="value" id="unrealPnl">–</div></div>
      </div>
      <section><h2>System</h2><div id="sysStatus"></div></section>
      <section>
        <button id="killBtn">🛑 KILL SWITCH</button>
        <div style="height:8px"></div>
        <button id="resumeBtn">Resume trading</button>
      </section>
      <section><h2>Agents</h2><div id="agentList"></div></section>
    </div>

    <div id="tab-pos" class="hidden">
      <section><h2>Open positions</h2><div id="posList"></div></section>
      <section><h2>Recent closed</h2><div id="closedList"></div></section>
    </div>

    <div id="tab-opps" class="hidden">
      <section><h2>Opportunity feed</h2><div id="oppList"></div></section>
    </div>

    <div id="tab-log" class="hidden">
      <section><h2>Alerts</h2><div id="alertList"></div></section>
      <section><h2>Audit trail</h2><div id="auditList"></div></section>
    </div>
  </div>
</main>
<nav id="navBar" class="hidden">
  <button data-tab="dash" class="active" style="flex:1">Home</button>
  <button data-tab="pos" style="flex:1">Positions</button>
  <button data-tab="opps" style="flex:1">Feed</button>
  <button data-tab="log" style="flex:1">Log</button>
</nav>
<script>
let token = localStorage.getItem('tradeos_token') || '';
const $ = id => document.getElementById(id);
const fmt = v => (v>=0?'+':'')+'$'+Math.abs(v).toFixed(2);
const money = v => '$'+Number(v).toFixed(2);
const cls = v => v>0?'green':(v<0?'red':'dim');

async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{
    'Authorization':'Bearer '+token, 'Content-Type':'application/json',
    ...(opts.headers||{})}});
  if(r.status===401){ showAuth(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error('api '+r.status);
  return r.json();
}
function showAuth(){ $('authView').classList.remove('hidden');
  $('appView').classList.add('hidden'); $('navBar').classList.add('hidden'); }
function showApp(){ $('authView').classList.add('hidden');
  $('appView').classList.remove('hidden'); $('navBar').classList.remove('hidden'); }

$('loginBtn').onclick = async () => {
  token = $('tokenBox').value.trim();
  try { await api('/api/dashboard'); localStorage.setItem('tradeos_token', token);
    showApp(); refresh(); } catch(e){ alert('Invalid token'); }
};

document.querySelectorAll('#navBar button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#navBar button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['dash','pos','opps','log'].forEach(t =>
    $('tab-'+t).classList.toggle('hidden', t!==b.dataset.tab));
  refresh();
});

$('killBtn').onclick = async () => {
  if(!confirm('Activate KILL SWITCH? All trading halts immediately.')) return;
  await api('/api/kill-switch/activate', {method:'POST',
    body: JSON.stringify({reason:'manual from dashboard'})});
  refresh();
};
$('resumeBtn').onclick = async () => {
  const r = await fetch('/api/kill-switch/resume', {method:'POST',
    headers:{'Authorization':'Bearer '+token}});
  const j = await r.json();
  if(!j.resumed) alert('Cannot resume:\n'+(j.problems||[]).join('\n'));
  refresh();
};

function row(top1, top2, sub, topCls=''){
  return `<div class="row"><div class="top"><span>${top1}</span>` +
    `<span class="${topCls}">${top2}</span></div>` +
    (sub?`<div class="sub">${sub}</div>`:'') + `</div>`;
}

async function refresh(){
  try{
    const d = await api('/api/dashboard');
    $('modePill').textContent = d.kill_switch ? 'KILLED' : d.mode.toUpperCase();
    $('modePill').className = 'pill ' + (d.kill_switch ? 'bad' : (d.trading_allowed?'ok':''));
    $('equity').textContent = money(d.equity_usd);
    $('cash').textContent = money(d.cash_usd);
    $('dailyPnl').textContent = fmt(d.daily_pnl_usd);
    $('dailyPnl').className = 'value '+cls(d.daily_pnl_usd);
    $('unrealPnl').textContent = fmt(d.unrealized_pnl_usd);
    $('unrealPnl').className = 'value '+cls(d.unrealized_pnl_usd);
    $('killBtn').style.display = d.kill_switch ? 'none' : 'block';
    $('resumeBtn').style.display = d.kill_switch ? 'block' : 'none';
    const ph = d.provider_health || {};
    const phOk = Object.keys(ph).length && Object.values(ph).every(p=>p.ok);
    $('sysStatus').innerHTML =
      row('Trading', d.trading_allowed?'ENABLED':'DISABLED',
          d.trading_problems.join('; '), d.trading_allowed?'green':'amber') +
      row('LLM agents', d.llm_available?'Claude connected':'heuristic mode', '',
          d.llm_available?'green':'amber') +
      row('Providers', Object.keys(ph).length ? (phOk?'healthy':'DEGRADED') : 'not checked',
          Object.entries(ph).map(([n,p])=>`${n}: ${p.ok?'ok':'FAIL'}`).join(' · '),
          phOk?'green':'amber') +
      row('Smart money', d.smartmoney_scanner ?
          (d.webhooks_active?'realtime + polling':'polling') : 'off',
          d.webhook_last_event ?
          ('last event '+Math.round(Date.now()/1000-Number(d.webhook_last_event))+'s ago') : '',
          d.smartmoney_scanner?'green':'dim') +
      row('Open positions', d.open_positions, '');
    $('agentList').innerHTML = Object.entries(d.agents).map(([name,hb])=>{
      const age = hb ? Math.round(Date.now()/1000 - hb.ts) : null;
      return row(name, hb?`${age}s ago`:'no heartbeat',
        hb?(hb.task||''):'', hb&&age<600?'green':'dim');
    }).join('');

    const open = await api('/api/positions?status=open');
    $('posList').innerHTML = open.length ? open.map(p =>
      row(p.symbol||p.token_address.slice(0,8), fmt(p.unrealized_pnl_usd),
        `${p.chain} · in ${money(p.cost_usd)} @ ${p.entry_price_usd} · ` +
        `<a style="color:var(--red)" href="#" onclick="closePos(${p.id});return false">close</a>`,
        cls(p.unrealized_pnl_usd))).join('') : '<div class="row dim">none</div>';
    const closed = await api('/api/positions?status=closed&limit=10');
    $('closedList').innerHTML = closed.length ? closed.map(p =>
      row(p.symbol||'?', fmt(p.realized_pnl_usd||0),
        `${p.exit_reason||''}`, cls(p.realized_pnl_usd||0))).join('')
      : '<div class="row dim">none</div>';

    const opps = await api('/api/opportunities');
    $('oppList').innerHTML = opps.length ? opps.map(o =>
      row(`${o.symbol||o.token_address.slice(0,8)} <span class="dim">${o.chain}</span>`,
        `${o.overall_score??'–'} <span class="dim">/ risk ${o.risk_score??'–'}</span>`,
        `${o.status} · momentum ${o.momentum_score??'–'} · ${o.id}`)).join('')
      : '<div class="row dim">none yet</div>';

    const alerts = await api('/api/alerts?limit=15');
    $('alertList').innerHTML = alerts.length ? alerts.map(a =>
      row(a.title, a.priority, a.body,
        a.priority==='critical'?'red':(a.priority==='high'?'amber':'dim'))).join('')
      : '<div class="row dim">none</div>';
    const audit = await api('/api/audit?limit=25');
    $('auditList').innerHTML = audit.map(a =>
      row(a.action, a.actor, a.opportunity_id||'', 'dim')).join('');
  }catch(e){ console.error(e); }
}
window.closePos = async id => {
  if(!confirm('Close position '+id+' at market?')) return;
  try{ await api('/api/positions/'+id+'/close', {method:'POST'}); }catch(e){ alert(e); }
  refresh();
};

if(token){ api('/api/dashboard').then(()=>{showApp();refresh();}).catch(showAuth); }
else showAuth();
setInterval(()=>{ if(!$('appView').classList.contains('hidden')) refresh(); }, 15000);
</script>
</body>
</html>
